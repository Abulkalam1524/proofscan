# Generated by benchmark/run_zap.py. Saved beside the report so the
# configuration behind a result is recorded rather than described.
env:
  contexts:
    - name: target
      urls:
        - "http://dvwa/"
      includePaths:
        - "http://dvwa.*"
      excludePaths:
        - '.*logout.*'
        - '.*setup\.php.*'
        - '.*security\.php.*'
        - '.*phpinfo.*'
  parameters:
    failOnError: false
    progressToStdout: true

jobs:
  - type: replacer
    parameters:
      deleteAllRules: true
    rules:
      - description: "session handed over from outside the scanner"
        enabled: true
        matchType: req_header
        matchString: Cookie
        matchRegex: false
        replacementString: "PHPSESSID=a3178e67bf919008baa8aac6cad7216a; security=low"
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 20

  - type: spider
    parameters:
      context: target
      maxDuration: 3

  - type: passiveScan-wait

  - type: activeScan
    parameters:
      context: target
      maxScanDurationInMins: 20

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: "zap-dvwa.json"
